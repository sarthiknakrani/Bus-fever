<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="gloveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="cuffGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Hand Group tilted pointing toward upper-left -->
  <g filter="url(#shadow)">
    <!-- Wrist / Cuff -->
    <path d="M 68 88 L 88 108 C 91 111 96 111 99 108 L 105 102 C 108 99 108 94 105 91 L 85 71 Z" fill="url(#cuffGrad)" stroke="#0369a1" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Palm and Fingers Main Silhouette -->
    <!-- Pointing Index Finger extends to (22, 22) -->
    <path d="
      M 48 48 
      L 24 24 
      C 18 18, 26 10, 32 16 
      L 58 42 
      C 60 40, 64 40, 67 42 
      L 74 49 
      C 77 48, 81 49, 83 52 
      L 88 58 
      C 91 58, 94 60, 95 64 
      C 96 68, 94 73, 91 76 
      L 78 88 
      C 73 93, 64 92, 58 87 
      L 48 76 
      C 43 72, 42 66, 44 61 
      L 48 54 
      Z" 
      fill="url(#gloveGrad)" stroke="#1e293b" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Inner Finger Crease Lines -->
    <path d="M 52 50 L 68 66" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 64 45 L 77 58" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 73 51 L 83 62" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Thumb fold -->
    <path d="M 44 61 C 48 64, 52 68, 55 74" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
