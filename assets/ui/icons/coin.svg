<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Outer rim metallic gold gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Inner face rich gold gradient -->
    <radialGradient id="goldFace" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="65%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>

    <!-- Embossed symbol gradient -->
    <linearGradient id="goldSymbol" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Specular highlight gradient -->
    <linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <circle cx="64" cy="68" r="56" fill="#78350f" opacity="0.35"/>

  <!-- Outer rim -->
  <circle cx="64" cy="64" r="56" fill="url(#goldRim)"/>

  <!-- Inner bevel edge -->
  <circle cx="64" cy="64" r="48" fill="#d97706"/>

  <!-- Main coin face -->
  <circle cx="64" cy="64" r="45" fill="url(#goldFace)"/>

  <!-- Inner circular ring groove -->
  <circle cx="64" cy="64" r="39" fill="none" stroke="#fef08a" stroke-width="2.5" opacity="0.8"/>
  <circle cx="64" cy="65" r="39" fill="none" stroke="#ca8a04" stroke-width="1.5" opacity="0.6"/>

  <!-- Embossed Dollar Symbol Shadow -->
  <g fill="#78350f" opacity="0.4" transform="translate(0, 3)">
    <path d="M60 26 h8 v8 h4 c7.7 0 14 6.3 14 14 c0 6.5 -4.5 12 -10.5 13.5 c7.5 2 12.5 8 12.5 15.5 c0 8.8 -7.2 16 -16 16 h-4 v8 h-8 v-8 h-4 c-2.2 0 -4 -1.8 -4 -4 s1.8 -4 4 -4 h4 v-16 h-4 c-7.7 0 -14 -6.3 -14 -14 c0 -6.5 4.5 -12 10.5 -13.5 c-7.5 -2 -12.5 -8 -12.5 -15.5 c0 -8.8 7.2 -16 16 -16 h4 v-8 z M60 42 h-4 c-3.3 0 -6 2.7 -6 6 s2.7 6 6 6 h4 z M68 74 h-8 v16 h4 c4.4 0 8 -3.6 8 -8 s-3.6 -8 -8 -8 z"/>
  </g>

  <!-- Embossed Dollar Symbol -->
  <g fill="url(#goldSymbol)" stroke="#fef08a" stroke-width="1.2">
    <!-- Vertical post -->
    <rect x="60.5" y="24" width="7" height="80" rx="3.5" fill="#fef08a"/>
    <!-- Upper loop -->
    <path d="M64 34 c-7.5 0 -13.5 5.5 -13.5 12.5 c0 7.5 6.5 11.5 13.5 14 c7.5 2.5 14 6.5 14 14.5 c0 8 -6.8 14 -15 14 c-6 0 -11.5 -3.2 -14 -8 c-1 -1.8 -0.4 -4.2 1.4 -5.2 c1.8 -1 4.2 -0.4 5.2 1.4 c1.6 3 5 4.8 8.4 4.8 c4.4 0 7.5 -3.2 7.5 -7 c0 -4.5 -4.5 -8 -11.5 -10.5 c-8 -3 -15 -7.2 -15 -15.5 c0 -7.5 6.2 -13.5 14.5 -13.5 c5.5 0 10.5 2.8 12.8 7 c1 1.8 0.4 4.2 -1.4 5.2 c-1.8 1 -4.2 0.4 -5.2 -1.4 c-1.4 -2.6 -4.2 -4.3 -7.2 -4.3 z"/>
  </g>

  <!-- Top-left specular gloss highlight -->
  <path d="M22 45 C30 25 50 14 74 14 C82 14 88 15 94 18 C80 22 50 32 36 56 C30 68 28 78 28 88 C23 76 20 60 22 45 Z" fill="url(#specular)"/>

  <!-- Star sparkle point near top-left rim -->
  <polygon points="34,26 36,32 42,34 36,36 34,42 32,36 26,34 32,32" fill="#ffffff" opacity="0.85"/>
</svg>
