<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="160" height="140">
  <defs>
    <filter id="cshadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="coinEdgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="frontCoinGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <g filter="url(#cshadow)">
    <!-- Back Coin 1 (Base of left stack) -->
    <ellipse cx="65" cy="72" rx="38" ry="18" fill="url(#coinEdgeGrad)" stroke="#78350f" stroke-width="2"/>
    <ellipse cx="65" cy="68" rx="38" ry="18" fill="url(#coinGrad)" stroke="#ca8a04" stroke-width="2"/>

    <!-- Middle Coin 2 -->
    <ellipse cx="65" cy="58" rx="38" ry="18" fill="url(#coinEdgeGrad)" stroke="#78350f" stroke-width="2"/>
    <ellipse cx="65" cy="54" rx="38" ry="18" fill="url(#coinGrad)" stroke="#ca8a04" stroke-width="2"/>

    <!-- Top Coin of stack -->
    <ellipse cx="65" cy="44" rx="38" ry="18" fill="url(#coinEdgeGrad)" stroke="#78350f" stroke-width="2"/>
    <ellipse cx="65" cy="40" rx="38" ry="18" fill="url(#coinGrad)" stroke="#78350f" stroke-width="2.5"/>
    <!-- Engraved inner ring and $ on top stack coin -->
    <ellipse cx="65" cy="40" rx="28" ry="13" fill="none" stroke="#eab308" stroke-width="2"/>
    <text x="65" y="46" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="20" fill="#a16207" text-anchor="middle">$</text>

    <!-- Foreground Leaning Coin (Right side) -->
    <g transform="translate(102, 78) rotate(15)">
      <!-- Outer rim -->
      <circle cx="0" cy="0" r="34" fill="url(#coinEdgeGrad)" stroke="#78350f" stroke-width="3"/>
      <!-- Inner face -->
      <circle cx="-1" cy="-2" r="30" fill="url(#frontCoinGrad)"/>
      <circle cx="-1" cy="-2" r="23" fill="none" stroke="#fef08a" stroke-width="2.5" opacity="0.9"/>
      <!-- Dollar sign in bold 3D -->
      <text x="0" y="10" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34" fill="#854d0e" text-anchor="middle">$</text>
      <text x="-1" y="8" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34" fill="#fef08a" text-anchor="middle">$</text>
    </g>
  </g>
</svg>
